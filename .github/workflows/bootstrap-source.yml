name: Bootstrap ClimaFlux source

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - ".bootstrap/READY-PR"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-source:
    if: github.event_name == 'workflow_dispatch' || github.event.action == 'opened' || github.event.action == 'reopened'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publication branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Reconstruct and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/climaflux-source.b64

          for n in {01..18}; do
            cat ".bootstrap/chunk-${n}.b64" >> /tmp/climaflux-source.b64
          done

          cat .bootstrap/chunk-19y-*.b64 | base64 --decode >> /tmp/climaflux-source.b64

          for n in {20..23}; do
            cat ".bootstrap/chunk-${n}.b64" >> /tmp/climaflux-source.b64
          done

          base64 --decode /tmp/climaflux-source.b64 > /tmp/climaflux-source.tar.gz
          echo "528555dd66740baa9f83de81269f4360a70d2ca02096596d37ee4bd15fbe180d  /tmp/climaflux-source.tar.gz" | sha256sum --check -

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/climaflux-source.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-source.yml

      - name: Commit project to publication branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "feat: publish ClimaFlux ERP v0.3.0"
          git push origin "HEAD:${{ github.head_ref }}"
