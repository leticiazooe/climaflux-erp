<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ClimaFlux ERP 0.3.0</title>
  <style>
    :root { color-scheme: light dark; font-family: Inter, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #eef3f1; color: #16322c; }
    main { width: min(680px, calc(100% - 32px)); padding: 40px; background: #fff; border: 1px solid #dce6e2; border-radius: 24px; box-shadow: 0 20px 60px rgba(16, 49, 42, .12); }
    h1 { margin: 0 0 12px; font-size: clamp(2rem, 6vw, 3.8rem); line-height: .95; }
    p { color: #5d716c; line-height: 1.65; }
    .progress { height: 10px; margin-top: 24px; overflow: hidden; border-radius: 999px; background: #dce6e2; }
    .progress span { display: block; width: 12%; height: 100%; border-radius: inherit; background: #19715f; animation: loading 1.2s ease-in-out infinite alternate; }
    .error { color: #a32d2d; white-space: pre-wrap; }
    @keyframes loading { to { width: 96%; } }
    @media (prefers-color-scheme: dark) { body { background:#101b18; color:#f3f7f5 } main { background:#172621; border-color:#29433a } p { color:#a9bcb6 } .progress { background:#29433a } }
  </style>
</head>
<body>
  <main>
    <p>ClimaFlux ERP · versão 0.3.0</p>
    <h1>Carregando o sistema…</h1>
    <p id="status">Lendo os arquivos da aplicação.</p>
    <div class="progress" aria-hidden="true"><span></span></div>
    <p class="error" id="error" role="alert"></p>
  </main>
  <script>
    const EXPECTED_SHA256 = '528555dd66740baa9f83de81269f4360a70d2ca02096596d37ee4bd15fbe180d';
    const ARCHIVE_ROOT = '.bootstrap';
    const BASE64_ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';

    async function fetchText(name) {
      const response = await fetch(`${ARCHIVE_ROOT}/${name}`, { cache: 'no-store' });
      if (!response.ok) throw new Error(`Não foi possível carregar ${name} (${response.status}).`);
      return response.text();
    }

    function decodeBase64(value) {
      let clean = String(value)
        .replace(/-/g, '+')
        .replace(/_/g, '/')
        .replace(/[^A-Za-z0-9+/=]/g, '');
      const firstPadding = clean.indexOf('=');
      if (firstPadding >= 0) clean = clean.slice(0, firstPadding);
      if (clean.length % 4 === 1) throw new Error('Bloco Base64 incompleto.');

      const output = [];
      let buffer = 0;
      let bits = 0;
      for (const char of clean) {
        const digit = BASE64_ALPHABET.indexOf(char);
        if (digit < 0) continue;
        buffer = (buffer << 6) | digit;
        bits += 6;
        if (bits >= 8) {
          bits -= 8;
          output.push((buffer >> bits) & 255);
          buffer &= (1 << bits) - 1;
        }
      }
      return new Uint8Array(output);
    }

    function concatBytes(parts) {
      const total = parts.reduce((sum, part) => sum + part.length, 0);
      const output = new Uint8Array(total);
      let offset = 0;
      for (const part of parts) {
        output.set(part, offset);
        offset += part.length;
      }
      return output;
    }

    async function sha256(bytes) {
      const digest = await crypto.subtle.digest('SHA-256', bytes);
      return [...new Uint8Array(digest)].map(byte => byte.toString(16).padStart(2, '0')).join('');
    }

    function parseTar(bytes) {
      const files = new Map();
      const decoder = new TextDecoder();
      let offset = 0;
      while (offset + 512 <= bytes.length) {
        const header = bytes.slice(offset, offset + 512);
        if (header.every(byte => byte === 0)) break;
        const text = (start, end) => decoder.decode(header.slice(start, end)).replace(/\0.*$/, '');
        const rawName = text(0, 100);
        const prefix = text(345, 500);
        const name = `${prefix ? `${prefix}/` : ''}${rawName}`.replace(/^\.\//, '');
        const size = Number.parseInt(text(124, 136).trim() || '0', 8);
        const start = offset + 512;
        files.set(name, bytes.slice(start, start + size));
        offset = start + Math.ceil(size / 512) * 512;
      }
      return files;
    }

    async function buildArchive() {
      const encodedChunks = [];
      for (let index = 1; index <= 18; index += 1) {
        encodedChunks.push(await fetchText(`chunk-${String(index).padStart(2, '0')}.b64`));
      }

      const chunk19Fragments = [];
      for (let index = 0; index <= 6; index += 1) {
        const encodedFragment = await fetchText(`chunk-19y-${String(index).padStart(2, '0')}.b64`);
        chunk19Fragments.push(new TextDecoder().decode(decodeBase64(encodedFragment)));
      }
      encodedChunks.push(chunk19Fragments.join(''));

      for (let index = 20; index <= 23; index += 1) {
        encodedChunks.push(await fetchText(`chunk-${index}.b64`));
      }

      return concatBytes(encodedChunks.map(decodeBase64));
    }

    async function launch() {
      if (!('DecompressionStream' in window)) throw new Error('Este navegador não oferece suporte à descompactação necessária.');

      document.getElementById('status').textContent = 'Validando a integridade do pacote…';
      const archive = await buildArchive();
      const actual = await sha256(archive);
      if (actual !== EXPECTED_SHA256) throw new Error(`Falha de integridade. Esperado ${EXPECTED_SHA256}, recebido ${actual}.`);

      document.getElementById('status').textContent = 'Montando a interface…';
      const stream = new Blob([archive]).stream().pipeThrough(new DecompressionStream('gzip'));
      const decompressed = new Uint8Array(await new Response(stream).arrayBuffer());
      const files = parseTar(decompressed);
      const decode = path => {
        const file = files.get(path);
        if (!file) throw new Error(`Arquivo ausente no pacote: ${path}`);
        return new TextDecoder().decode(file);
      };

      let html = decode('index.html');
      html = html.replace('<link rel="manifest" href="manifest.webmanifest">', '');
      html = html.replace('<link rel="manifest" href="manifest.webmanifest" />', '');
      html = html.replace('<link rel="stylesheet" href="styles.css">', `<style>${decode('styles.css')}</style>`);
      html = html.replace('<link rel="stylesheet" href="styles.css" />', `<style>${decode('styles.css')}</style>`);
      html = html.replace(/<script src="([^"]+)"><\/script>/g, (_, path) => `<script>${decode(path).replace(/<\/script>/gi, '<\\/script>')}<\/script>`);

      document.open();
      document.write(html);
      document.close();
    }

    launch().catch(error => {
      document.querySelector('.progress')?.remove();
      document.getElementById('status').textContent = 'Não foi possível iniciar automaticamente.';
      document.getElementById('error').textContent = error.message;
      console.error(error);
    });
  </script>
</body>
</html>
