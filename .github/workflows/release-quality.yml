name: Release quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate-saas-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase1-saas-foundation
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply one-time Phase 1 hardening
        run: |
          node scripts/phase1-hardening-autofix.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/index.js auth/admin-access.js auth/customers-saas.html auth/customers-saas.js
          git diff --cached --quiet || git commit -m "fix: harden Phase 1 authentication and permissions"
          git push origin HEAD:agent/phase1-saas-foundation

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Validate source, tests and release
        run: npm run validate

      - name: Verify v0.7.0 SaaS foundation
        shell: bash
        run: |
          set -euo pipefail
          test -s public/index.html
          test -s public/styles.css
          test -s public/app.js
          test -s public/domain.js
          test -s public/manifest.webmanifest
          test -s public/sw.js
          test -s public/icon.svg
          test -s public/auth.css
          test -s public/login.html
          test -s public/login.js
          test -s public/auth-client.js
          test -s public/admin-access.html
          test -s public/admin-access.js
          test -s public/customers-saas.html
          test -s public/customers-saas.js
          test -s worker/index.js
          test -s worker/auth.js
          test -s worker/security.js
          test -s worker/policy.js
          test -s migrations/0001_saas_foundation.sql
          grep -q 'climaflux-version' public/index.html
          grep -q '0.7.0' public/index.html
          grep -q 'accounts.google.com/gsi/client' public/login.html
          grep -q '/api/v1/customers' public/auth-client.js
          grep -q '/api/v1/admin/invites' public/admin-access.js
          grep -q 'climaflux-saas-public-v070' public/sw.js
          grep -q 'run_worker_first' wrangler.jsonc
          grep -q 'tenant_id TEXT NOT NULL' migrations/0001_saas_foundation.sql
          grep -q 'LAST_ADMIN_REQUIRED' worker/index.js
          grep -q 'Idempotency-Key' auth/auth-client.js
          echo 'ClimaFlux ERP v0.7.0 SaaS foundation validated.'
