name: Release quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Check session and access JavaScript
        run: |
          node --check preview/admin-access.js
          node --check preview/login-preview.js
          node --check preview/session-preview.js
          node --check preview/session-sw.js

      - name: Rebuild verified public release
        run: npm run build:public

      - name: Verify v0.6.2 session flow
        shell: bash
        run: |
          set -euo pipefail
          test -s public/index.html
          test -s public/styles.css
          test -s public/app.js
          test -s public/domain.js
          test -s public/manifest.webmanifest
          test -s public/sw.js
          test -s public/icon.svg
          test -s public/admin-access.html
          test -s public/admin-access.css
          test -s public/admin-access.js
          test -s public/login.html
          test -s public/login-preview.js
          test -s public/session-preview.css
          test -s public/session-preview.js
          grep -q 'Despacho e SLA' public/app.js
          grep -q 'Portal do cliente' public/app.js
          grep -q 'Usuários e permissões' public/admin-access.html
          grep -q 'logoutButton' public/admin-access.html
          grep -q 'Entrar no sistema' public/login.html
          grep -q 'climaflux-preview-session-v1' public/login-preview.js
          grep -q 'Sair do sistema' public/session-preview.js
          grep -q 'Gestão de acessos' public/session-preview.js
          grep -q 'session-preview.js' public/index.html
          grep -q 'climaflux-v062-session-shell' public/sw.js
          echo 'ClimaFlux ERP v0.6.2 login, logout, access preview and PWA cache validated.'
