name: Release quality

on:
  push:
    branches: [main, agent/google-authentication]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Check authentication JavaScript
        run: npm run check:auth

      - name: Run authentication tests
        run: npm run test:auth

      - name: Rebuild verified public release
        run: npm run build:public

      - name: Verify protected assets
        shell: bash
        run: |
          set -euo pipefail
          test -s public/index.html
          test -s public/styles.css
          test -s public/app.js
          test -s public/domain.js
          test -s public/manifest.webmanifest
          test -s public/sw.js
          test -s public/icon.svg
          test -s public/login.html
          test -s public/login.js
          test -s public/auth.css
          test -s public/auth-client.js
          test -s public/admin-access.html
          test -s public/admin-access.js
          grep -q 'auth-client.js' public/index.html
          grep -q 'Google' public/login.html
          grep -q 'ClimaFlux ERP v0.7.0' scripts/build-public.mjs
          echo 'ClimaFlux ERP v0.7.0 authentication release validated.'
